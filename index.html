    const state=game.deadline?'running':'paused',button=$('#timer-toggle');if(button.dataset.state!==state){button.dataset.state=state;button.innerHTML=`${icon(game.deadline?'pause':'play')}<span>${game.deadline?'Pausar':'Continuar'}</span>`;icons();}button.disabled=seconds===0;
  }
  function extendTimer(){updateTimer();const expired=game.remaining<=0;game.remaining+=30000;game.total+=30000;game.lastTick=null;if(game.deadline)game.deadline+=30000;$('#timer-announcement').textContent='30 segundos más. El secreto sigue en juego.';if(expired)startTimer();else updateTimer();}
  function voteView(){const count=game.impostorIds.length;return screen(`${heading('El veredicto','¿Quién está<br><em>fingiendo?</em>',`Acuerden su voto y elijan ${count===1?'un sospechoso':'dos sospechosos'}.`)}<div class="stage-body"><div class="vote-grid scroll-list">${game.players.map(p=>`<button class="vote-choice" data-action="suspect" data-id="${p.id}" aria-pressed="${game.votes.includes(p.id)}"><span class="avatar">${escapeHTML(p.name.slice(0,2).toLocaleUpperCase('es'))}</span><span class="vote-name">${escapeHTML(p.name)}</span>${game.votes.includes(p.id)?icon('check'):''}</button>`).join('')}</div><p class="vote-status" aria-live="polite">${game.votes.length} de ${count} ${count===1?'sospechoso seleccionado':'sospechosos seleccionados'}</p><p class="note">${icon('eye')}Si los descubren, tendrán un intento para adivinar la palabra.</p></div>`);}
  const impostorNames=()=>game.players.filter(p=>game.impostorIds.includes(p.id)).map(p=>escapeHTML(p.name)).join(' y ');
  function guessView(){const plural=game.impostorIds.length>1;return screen(`${heading('Última oportunidad',plural?'Los descubrieron.':'Te descubrieron.',`${plural?'Los impostores tienen':'El impostor tiene'} un intento para adivinar la palabra.`,true)}<section class="panel guess-card"><div class="secret-symbol">${crest('dagger')}</div><p class="result-names">${impostorNames()}</p><form id="guess-form"><label for="word-guess">${plural?'Su respuesta en equipo':'Tu respuesta'}</label><input id="word-guess" class="field" maxlength="48" placeholder="¿Cuál era la palabra?" autocomplete="off" autocapitalize="none" spellcheck="false" required enterkeyhint="done"></form></section>`);}
  function resultView(){const crew=game.outcome==='crew',plural=game.impostorIds.length>1;return screen(`${heading('Misterio resuelto',crew?'Ganaron<br>los tripulantes.':`Gan${plural?'aron<br>los impostores.':'ó<br>el impostor.'}`,crew?'Esta vez, la verdad salió a la luz.':game.outcome==='guessed'?'Una última palabra cambió toda la partida.':'El engaño sobrevivió a todas las miradas.',true)}<section class="panel result-card"><div class="result-content"><div class="secret-symbol">${crest(crew?'victory':'dagger')}</div><p class="label muted">${plural?'Los impostores eran':'El impostor era'}</p><p class="result-names">${impostorNames()}</p><div class="divider"></div><p class="label muted">La palabra secreta</p><p class="result-word">${escapeHTML(game.word)}</p><p class="subtle">${escapeHTML(game.category.name)}</p></div></section><p class="result-detail">La mesa votó por ${game.players.filter(p=>game.votes.includes(p.id)).map(p=>escapeHTML(p.name)).join(' y ')}.</p>`);}
  function finish(outcome){document.activeElement?.blur();clearInterval(timerInterval);releaseWakeLock();game.deadline=null;game.outcome=outcome;setView('result');sound(outcome==='crew'?'crew-win':'impostor-win');if(window.confetti)window.confetti({particleCount:85,spread:75,origin:{y:.65},colors:['#ff6b00','#8b49c1','#c398fa','#f5f5f7'],zIndex:40,disableForReducedMotion:true});}
  const modalHeader=title=>`<div class="dialog-heading"><h2 id="modal-title">${title}</h2><button class="icon-button" data-action="close-modal" aria-label="Cerrar">${icon('x')}</button></div>`;
  function syncSplashMotion(){document.documentElement.classList.toggle('motion-paused',document.hidden||modal.open);}
  modal.addEventListener('close',syncSplashMotion);
  function openModal(html){stopHold();modal.innerHTML=html;if(!modal.open)modal.showModal();syncSplashMotion();icons();}
  function showHelp(){openModal(`${modalHeader('El arte de sospechar')}<ol><li><strong>Reúne al grupo.</strong> Mínimo 3 jugadores para 1 impostor, o 5 para 2.</li><li><strong>Protege tu carta.</strong> Pasa el teléfono. Mantén presionado para ver tu rol y suelta para ocultarlo. Los tripulantes ven la misma palabra; los impostores no.</li><li><strong>Empieza el debate.</strong> Tras la última carta, el tiempo comienza: 30 segundos por jugador. Den pistas sin revelar la palabra. Puedes pausar o agregar 30 segundos.</li><li><strong>Acuerden su voto.</strong> Con 2 impostores deben descubrir a ambos. Si el grupo falla, ganan los impostores.</li><li><strong>Una última oportunidad.</strong> Si los descubren, los impostores pueden ganar adivinando la palabra. Tienen un solo intento, en equipo.</li></ol><div class="divider"></div><p><strong>En tu iPhone:</strong> abre en Safari, toca Compartir y selecciona “Agregar a inicio”.</p><p class="small-print">Los nombres y las categorías se guardan en este dispositivo. Los sonidos se generan en el teléfono. La partida funciona sin conexión una vez abierta; volver a abrir la página sin internet depende de la caché del navegador.</p><button class="primary" data-action="close-modal">Entendido</button>`);}
  function showCustom(){if(settings.custom.length>=20)return toast('Puedes crear hasta 20 categorías.');openModal(`${modalHeader('Tu propio misterio')}<p>Recuerdos, lugares o secretos que solo tu grupo conoce.</p><form id="category-form"><label for="category-name">Nombre de la categoría</label><input id="category-name" class="field" maxlength="36" required placeholder="Ej. Leyendas de la fiesta" autocomplete="off"><label for="category-words">Palabras separadas por comas o saltos de línea</label><textarea id="category-words" class="field" maxlength="5000" required placeholder="La terraza, El vecino, El karaoke"></textarea><p class="small-print">De 3 a 100 palabras distintas. Hasta 48 caracteres por palabra.</p><p id="category-error" class="error-text" role="alert"></p><button class="primary" type="submit">Guardar categoría ${icon('plus')}</button></form>`);}
  function confirmReset(){openModal(`${modalHeader(view==='setup'?'¿Volver al primer paso?':'¿Terminar la partida?')}<p>${view==='setup'?'Volverás a la lista de jugadores.':'La partida actual termina y sus roles se descartan.'} Tus jugadores, categorías y preferencias se conservan.</p><div class="action-row"><button class="secondary" data-action="close-modal">Cancelar</button><button class="danger" data-action="reset-confirm">${view==='setup'?'Volver':'Terminar'}</button></div>`);}
  document.addEventListener('submit',event=>{
    if(event.target.id==='player-form'){event.preventDefault();const input=$('#player-name'),name=cleanText(input.value).slice(0,24);if(!normalize(name))return toast('Escribe un nombre con letras o números.');if(settings.players.length>=20)return toast('La mesa está llena: máximo 20 jugadores.');if(settings.players.some(p=>normalize(p)===normalize(name)))return toast('Ese nombre ya está en la mesa. Agrega un apodo.');sound('click');settings.players.push(name);saveSettings();input.value='';refreshPlayers();$('#players-container').scrollTop=$('#players-container').scrollHeight;input.focus({preventScroll:true});}
    if(event.target.id==='category-form'){event.preventDefault();const name=cleanText($('#category-name').value).slice(0,36),raw=$('#category-words').value.split(/[,;\n]+/).map(cleanText).filter(Boolean),words=raw.filter((w,i,a)=>a.findIndex(x=>normalize(x)===normalize(w))===i);let error='';if(!normalize(name))error='Escribe un nombre para la categoría.';else if(allCategories().some(c=>normalize(c.name)===normalize(name)))error='Ya existe una categoría con ese nombre.';else if(words.length<3||words.length>100)error='Agrega entre 3 y 100 palabras distintas.';else if(words.some(w=>w.length>48||!normalize(w)))error='Cada palabra debe tener letras o números y hasta 48 caracteres.';if(error){$('#category-error').textContent=error;return;}const id=`custom-${Date.now().toString(36)}-${randomIndex(1000000).toString(36)}`;settings.custom.push({id,name,icon:'layers',words});settings.active.push(id);saveSettings();modal.close();render();toast('Tu categoría ya forma parte del misterio.');}
    if(event.target.id==='guess-form'){event.preventDefault();if(!normalize($('#word-guess').value))return toast('Escribe tu respuesta antes de revelar.');finish(normalize($('#word-guess').value)===normalize(game.word)?'guessed':'crew');}
  });
  document.addEventListener('click',event=>{
    const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
    if(action==='enter'){enterParty();return;}
    if(action==='sound'){settings.muted=!settings.muted;if(audioMaster)audioMaster.gain.setValueAtTime(settings.muted?0:.65,audioCtx.currentTime);saveSettings();updateSound();icons();if(!settings.muted)sound('click');return;}
    if(!['suspect','confirm-vote','skip-guess'].includes(action))sound('click');
    if(action==='close-modal')return modal.close();
    if(action==='help')return showHelp();if(action==='reset')return confirmReset();
    if(action==='next'&&view==='setup'&&!stepError()){document.activeElement?.blur();step=Math.min(3,step+1);render();app.focus({preventScroll:true});}
    if(action==='back'&&view==='setup'){step=Math.max(0,step-1);render();app.focus({preventScroll:true});}
    if(action==='remove-player'){settings.players.splice(Number(b.dataset.index),1);saveSettings();refreshPlayers();$('#player-name').focus({preventScroll:true});}
    if(action==='impostors'){settings.impostors=Number(b.dataset.count);saveSettings();document.querySelectorAll('[data-action="impostors"]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));renderActions();icons();}
    if(action==='hints'){settings.hints=!settings.hints;b.setAttribute('aria-checked',String(settings.hints));saveSettings();}
    if(action==='category'){const id=b.dataset.id;settings.active=settings.active.includes(id)?settings.active.filter(x=>x!==id):[...settings.active,id];b.setAttribute('aria-pressed',String(settings.active.includes(id)));$('#category-count').textContent=`${settings.active.length} activas`;saveSettings();renderActions();icons();}
    if(action==='custom')showCustom();
    if(action==='delete-category'){const c=settings.custom.find(c=>c.id===b.dataset.id);if(c)openModal(`${modalHeader('¿Eliminar categoría?')}<p>Se eliminarán “${escapeHTML(c.name)}” y sus palabras de este dispositivo.</p><div class="action-row"><button class="secondary" data-action="close-modal">Cancelar</button><button class="danger" data-action="delete-category-confirm" data-id="${c.id}">Eliminar</button></div>`);}
    if(action==='delete-category-confirm'){settings.custom=settings.custom.filter(c=>c.id!==b.dataset.id);settings.active=settings.active.filter(id=>id!==b.dataset.id);saveSettings();modal.close();render();}
    if(action==='start')startGame();if(action==='next-player')nextPlayer();
    if(action==='timer-toggle'){if(game.deadline)pauseTimer();else startTimer();}
    if(action==='timer-extend')extendTimer();
    if(action==='vote'){pauseTimer();setView('vote');}
    if(action==='suspect'){const id=Number(b.dataset.id);if(game.votes.includes(id))game.votes=game.votes.filter(x=>x!==id);else if(game.votes.length<game.impostorIds.length)game.votes.push(id);else if(game.impostorIds.length===1)game.votes=[id];else return toast('Quita una selección antes de elegir otra persona.');sound('vote');const list=$('.vote-grid'),scroll=list.scrollTop;render();$('.vote-grid').scrollTop=scroll;app.querySelector(`[data-action="suspect"][data-id="${id}"]`)?.focus({preventScroll:true});}
    if(action==='back-debate')setView('game');
    if(action==='confirm-vote'&&game.votes.length===game.impostorIds.length){if(game.impostorIds.every(id=>game.votes.includes(id))){sound('vote');setView('guess');}else finish('impostors');}
    if(action==='skip-guess')finish('crew');
    if(action==='setup'||action==='reset-confirm'){clearInterval(timerInterval);releaseWakeLock();modal.close();stopHold();game=null;step=0;setView('setup');}
  });
  document.addEventListener('pointerdown',unlockAudio,{passive:true});document.addEventListener('keydown',unlockAudio);
  window.addEventListener('blur',stopHold);window.addEventListener('pagehide',()=>{stopHold();releaseWakeLock();});window.addEventListener('pointerup',stopHold);window.addEventListener('pointercancel',stopHold);
  document.addEventListener('visibilitychange',()=>{syncSplashMotion();stopHold();if(!document.hidden){updateTimer();requestWakeLock();}else if(audioCtx?.state==='running')audioCtx.suspend().catch(()=>{});});
  // Keyboard-aware viewport height without ever enabling document scrolling.
  function syncViewport(){
    const root=document.documentElement,v=window.visualViewport;
    // Ignore pinch zoom: accessibility zoom must not reflow the app around the lens.
    if(v && Math.abs(v.scale-1)>.02)return;
    const height=Math.round(v?.height||window.innerHeight),top=Math.round(v?.offsetTop||0);
    root.style.setProperty('--app-height',`${height}px`);
    root.style.setProperty('--viewport-top',`${top}px`);
    const styles=getComputedStyle(root),safeTop=parseFloat(styles.getPropertyValue('--safe-top'))||0,safeBottom=parseFloat(styles.getPropertyValue('--safe-bottom'))||0;
    const usable=height-safeTop-safeBottom;
    root.classList.toggle('compact',usable<650);root.classList.toggle('short',usable<510);
  }
  window.visualViewport?.addEventListener('resize',syncViewport);window.visualViewport?.addEventListener('scroll',syncViewport);window.addEventListener('resize',syncViewport);syncViewport();
  function configureAppIcons(){
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240"><rect width="240" height="240" rx="52" fill="#09090b"/><g transform="translate(16 26) scale(.86)" fill="none" stroke="#ff6b00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M112 55c-8-19 2-33 21-36-4 12-5 24-2 36M130 51c16-18 34-20 49-13-10 13-25 19-44 18"/><path d="M120 64c-39-21-84 3-88 47-5 45 25 76 63 75 18 10 35 10 51 0 40 3 69-30 64-75-4-43-45-68-81-48Z"/><path d="M102 64c-27 20-32 76-14 111m48-111c26 19 31 77 13 111M119 68v24m1 80v15"/><path d="m62 112 32 10-23 11Zm116 0-32 10 23 11ZM109 140l11-16 11 16M77 151l20 7 9-5 14 8 14-8 9 5 20-7-15 21-28 4-28-4Z"/></g></svg>`,url=`data:image/svg+xml,${encodeURIComponent(svg)}`;
    $('#favicon').href=url;$('#touch-icon').href=url;
    const image=new Image();image.onload=()=>{try{const canvas=document.createElement('canvas');canvas.width=canvas.height=180;canvas.getContext('2d').drawImage(image,0,0,180,180);$('#touch-icon').href=canvas.toDataURL('image/png');}catch{}};image.src=url;
    const manifest={name:'IMPOSTOR: HALLOWEDDA EDITION',short_name:'Impostor',start_url:location.href.split('#')[0].split('?')[0],display:'standalone',background_color:'#09090b',theme_color:'#09090b',icons:[{src:url,sizes:'any',type:'image/svg+xml',purpose:'any'}]};$('#manifest').href=`data:application/manifest+json,${encodeURIComponent(JSON.stringify(manifest))}`;
  }
  configureAppIcons();render();window.addEventListener('load',icons);if(storageFailed)toast('Almacenamiento no disponible. Puedes jugar durante esta sesión.');
  </script>
