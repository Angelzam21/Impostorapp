      settings=loadSettings(memoryStorage);activeLayer?.remove();activeLayer=null;setupLayer=null;applyTheme();setView('setup');

        assert(settings.players.length===7,'La carga debe eliminar duplicados sin perder jugadores.');
        assert(activePlayers().length===6,'Un jugador en descanso no debe participar.');
        const rows=[...setupLayer.querySelectorAll('.player-row')];
        assert(rows.length===settings.players.length,'La lista renderizada no coincide con los datos.');
        rows.forEach((row,index)=>assert(row.querySelector('.player-name').firstChild.textContent===settings.players[index].name,'Nombre renderizado incorrectamente.'));
        assert(!setupLayer.querySelector('ana'),'Un nombre no debe interpretarse como HTML.');
        assert(loadSettings(memoryStorage).players[0].name==='Edda','La recarga perdió los jugadores.');
      });
      test('Categorías por edición y selección guardada',()=>{
        assert(DEFAULT_CATEGORIES.length===8,'Faltan categorías generales o de evento.');
        assert(new Set(DEFAULT_CATEGORIES.map(category=>category.id)).size===8,'Hay IDs de categoría duplicados.');
        assert(setupLayer.querySelectorAll('[data-action="category"]').length===8,'Faltan categorías renderizadas.');
        assert(!startError(),'La configuración válida no permite iniciar.');
        const migrated=loadSettings({getItem:()=>JSON.stringify({...fixture,active:['costumes','edda']})});
        assert(migrated.active.join(',')==='halloween,birthday','La migración perdió la selección guardada.');
      });
      test('Temas, apariencia y migración de preferencias',()=>{
        const originalSave=saveSettings;let saved;
        saveSettings=()=>{saved=JSON.stringify(settings);};
        try{
          $('[data-action="edition"][data-value="standard"]').click();
          assert(allCategories().length===6&&!allCategories().some(c=>c.id==='halloween'),'Estándar debe mostrar solo seis categorías generales.');
          assert(!settings.active.includes('halloween')&&!settings.active.includes('birthday'),'Quedaron categorías de evento seleccionadas.');
          $('[data-action="appearance"][data-value="light"]').click();
          assert(document.documentElement.dataset.appearance==='light','No se aplicó la apariencia clara.');
          const reloaded=loadSettings({getItem:()=>saved});
          assert(reloaded.edition==='standard'&&reloaded.appearance==='light','No se guardaron las dos preferencias.');
          $('[data-action="edition"][data-value="halloween"]').click();
          assert(document.documentElement.dataset.appearance==='dark'&&settings.appearance==='light','Halloween debe usar oscuro y conservar la preferencia estándar.');
          assert(allCategories().length===8&&settings.active.includes('halloween'),'Falta la categoría de Halloween.');
          $('[data-action="edition"][data-value="standard"]').click();
          assert(document.documentElement.dataset.appearance==='light','No se restauró la apariencia al volver a Estándar.');
          const legacy=loadSettings({getItem:()=>JSON.stringify({players:['Ana'],active:['halloween','birthday'],custom:[]})});
          assert(legacy.active.length>0&&!legacy.active.includes('halloween'),'La migración dejó una selección no válida.');
          assert(loadSettings({getItem:()=>'{malformed'}).edition==='standard','No se recuperó de almacenamiento corrupto.');
        }finally{
          saveSettings=originalSave;settings=loadSettings(memoryStorage);refreshPreferences();refreshPlayers();
        }
      });
      test('Roles válidos con uno y dos impostores',()=>{
        for(const count of [1,2]){
          settings.impostors=count;startGame();
          assert(game.players.length===6,'Debe usar solo jugadores activos.');
          assert(game.impostorIds.length===count&&new Set(game.impostorIds).size===count,'Cantidad de impostores inválida.');
          assert(game.impostorIds.every(id=>game.players.some(player=>player.id===id)),'Se asignó un rol fuera de la mesa.');
          assert(game.category.words.includes(game.word),'Palabra ajena a la categoría elegida.');
          assert($('#next-player').disabled&&!game.seen,'No debe avanzar antes de ver la carta.');
          assert(!$('#secret-card').textContent.includes(game.word),'La carta expone la palabra antes de mantener presionado.');
        }
      });
      test('La asignación depende del azar',()=>{
        settings.impostors=1;
        // Deterministic random-source boundaries avoid a flaky probability test.
        randomIndex=()=>0;startGame();const first=game.impostorIds[0];
        randomIndex=length=>length-1;startGame();
        assert(game.impostorIds[0]!==first,'La asignación ignora la fuente aleatoria.');
        randomIndex=original.randomIndex;
      });
      test('Debate de 60 segundos: inicio y avance',()=>{
        game.passIndex=game.players.length-1;game.seen=true;nextPlayer();
        assert(view==='game'&&game.remaining===60000&&game.total===60000,'Cada ronda debe empezar en 60 segundos.');
        assert($('#timer-display').textContent==='01:00','Tiempo inicial incorrecto.');
        assert(intervals.size===1,'Debe haber un solo intervalo activo.');
        advance(15000);
        assert(game.remaining===45000&&$('#timer-display').textContent==='00:45','El reloj no avanza correctamente.');
        assert(speakingOrder()[0].id===game.firstSpeaker.id,'El orden no comienza por el jugador sorteado.');
      });
      test('Pausa, reanudación y extensión del debate',()=>{
        pauseTimer();const remaining=game.remaining;advance(5000);
        assert(game.remaining===remaining&&!game.deadline&&intervals.size===0,'El reloj avanza durante la pausa.');
        assert($('#timer-label').textContent==='En pausa','La pausa no se refleja en pantalla.');
        startTimer();startTimer();
        assert(intervals.size===1,'Reanudar duplica el intervalo.');
        advance(5000);assert(game.remaining===40000,'Reanudar perdió el tiempo restante.');
        extendTimer();assert(game.remaining===70000&&game.total===90000,'La extensión debe agregar 30 segundos.');
      });
      test('Fin del debate y reinicio tras agregar tiempo',()=>{
        advance(70000);
        assert(game.remaining===0&&!game.deadline&&intervals.size===0,'El temporizador no se detuvo en cero.');
        assert($('#timer-display').textContent==='00:00'&&$('#timer-toggle').disabled,'Estado final incorrecto.');
        assert($('#timer-announcement').textContent.includes('Es hora de votar'),'Falta el aviso de votación.');
        advance(5000);assert(game.remaining===0,'El tiempo se volvió negativo.');
        extendTimer();assert(game.remaining===30000&&intervals.size===1,'No se puede extender un debate terminado.');
        pauseTimer();
      });
      const cast=ids=>ids.forEach(id=>{openBallot();activeLayer.querySelector(`[data-action="suspect"][data-id="${id}"]`).click();actions.querySelector('[data-action="confirm-vote"]').click();});
      const prepare=(impostors=1)=>{settings.impostors=impostors;startGame();game.impostorIds=Array.from({length:impostors},(_,i)=>i);game.firstSpeaker=game.players[0];setView('game');beginVoting();};
      test('Carta privada: mantener, soltar y pasar',()=>{
        settings.impostors=1;startGame();
        assert($('#secret-card').hidden,'La carta debe comenzar oculta.');
        beginHold();advance(649);assert($('#secret-card').hidden,'La carta se abrió demasiado pronto.');
        advance(1);assert(!$('#secret-card').hidden&&game.seen,'No se reveló la carta al mantener.');
        stopHold();assert($('#secret-card').hidden&&!$('#next-player').disabled,'Soltar debe ocultar y permitir pasar.');
        nextPlayer();assert(game.passIndex===1&&!game.seen&&$('#next-player').disabled,'El siguiente jugador heredó acceso.');
      });
      test('Privacidad táctil: salir del botón, cancelar y perder foco',()=>{
        startGame();const button=$('#hold-button'),box=button.getBoundingClientRect();
        const touch=(type,x,y)=>{const e=new Event(type,{bubbles:true,cancelable:true}),point={identifier:7,clientX:x,clientY:y};Object.defineProperty(e,'touches',{value:type==='touchcancel'?[]:[point]});Object.defineProperty(e,'changedTouches',{value:[point]});button.dispatchEvent(e);};
        touch('touchstart',box.left+10,box.top+10);advance(650);
        assert(!$('#secret-card').hidden,'La pulsación táctil no revela la carta.');
        touch('touchmove',box.right+20,box.top+10);
        assert($('#secret-card').hidden&&!$('#secret-card').textContent.includes(game.word),'Salir del botón deja información privada visible.');
        touch('touchstart',box.left+10,box.top+10);touch('touchcancel',0,0);advance(700);
        assert($('#secret-card').hidden&&!holding,'Cancelar dejó pendiente una revelación.');
        beginHold();advance(650);window.dispatchEvent(new Event('blur'));
        assert($('#secret-card').hidden&&!holding,'Perder foco dejó la carta abierta.');
      });
      test('Votos individuales, selección única y recuento completo',()=>{
        prepare();
        assert(view==='votePass'&&!activeLayer.querySelector('[data-action="suspect"]'),'Falta el pase privado.');openBallot();
        assert(actions.querySelector('[data-action="confirm-vote"]').disabled,'Registrar debe estar bloqueado sin selección.');
        registerVote();assert(!game.ballots.length,'Se registró un voto vacío.');
        cast([0]);registerVote();assert(game.ballots.length===1,'Un doble registro duplicó el voto.');
        assert(game.selectedVote===null&&!activeLayer.querySelector('[aria-pressed="true"]'),'El siguiente turno heredó la selección.');
        assert(!app.querySelector('.view-exit [data-action="suspect"]'),'El voto anterior permanece visible.');
        openBallot();assert($('#voter-title').textContent===`Turno de voto: ${game.players[1].name}`,'Turno incorrecto.');
        cast([0,0,1,1,2]);
        assert(view==='voteSummary'&&game.ballots.length===6,'No se llegó al recuento.');
        assert(game.tally.map(p=>p.count).join(',')==='3,2,1,0,0,0','Recuento incorrecto.');
        assert(activeLayer.querySelectorAll('.vote-summary-row').length===6,'Faltan jugadores sin votos.');
        assert(game.votes.join(',')==='0'&&!game.outcome,'Se reveló el resultado antes de solicitarlo.');
      });
      test('Suspenso de 4 segundos, pausa de 1,5 y última oportunidad',()=>{
        beginReveal();advance(3999);
        assert(game.revealStage==='processing'&&!activeLayer.querySelector('.dramatic-name'),'Se reveló el nombre antes de 4 segundos.');
        advance(1);assert(game.revealStage==='name'&&!activeLayer.querySelector('.dramatic-verdict'),'Se filtró el veredicto con el nombre.');
        advance(1499);assert(game.revealStage==='name','La micropausa fue demasiado corta.');
        advance(1);assert(activeLayer.querySelector('.dramatic-verdict').textContent==='Y era... ¡EL IMPOSTOR!','Veredicto incorrecto.');
        continueVerdict();assert(view==='guess','Debe conservar la oportunidad de adivinar.');
        const before=sessionScore.innocents;finish('crew');finish('crew');
        assert(sessionScore.innocents===before+1,'El resultado duplicó el marcador.');
      });
      test('Tripulante acusado y cancelación de la revelación',()=>{
        prepare();cast([2,2,2,2,2,2]);beginReveal();advance(5500);
        assert(activeLayer.querySelector('.dramatic-verdict').textContent==='Y era... TRIPULANTE','Un tripulante fue presentado como impostor.');
        continueVerdict();assert(game.outcome==='impostors','Debe ganar el impostor si acusan a un tripulante.');
        prepare();cast([0,0,0,0,0,0]);beginReveal();advance(2000);startGame();advance(8000);
        assert(view==='pass'&&!revealStep,'Una revelación cancelada alteró la ronda nueva.');
      });
      test('Suspenso pausado al ocultar la página',()=>{
        prepare();cast([0,0,0,0,0,0]);beginReveal();advance(2000);pauseReveal();advance(10000);
        assert(game.revealStage==='processing','El suspenso avanzó mientras estaba pausado.');
        resumeReveal();advance(1999);assert(game.revealStage==='processing','No conservó el tiempo restante.');
        advance(1);assert(game.revealStage==='name','No reanudó el suspenso.');
        cancelReveal();
      });
      test('Reanudar varias veces no duplica la revelación',()=>{
        prepare();cast([0,0,0,0,0,0]);beginReveal();advance(30);resumeReveal();resumeReveal();
        advance(3970);assert(game.revealStage==='name','No reveló el nombre a los cuatro segundos.');
        advance(30);assert(game.revealStage==='name','Una reanudación duplicada adelantó el veredicto.');
        advance(1470);assert(game.revealStage==='verdict','No completó la micropausa.');
      });
      test('Empate, desempate repetido y dos impostores',()=>{
        prepare(2);cast([0,0,0,0,1,2]);
        assert(game.lockedIds.join(',')==='0'&&game.tiedIds.join(',')==='1,2','No conservó el primer puesto al empatar el segundo.');
        beginReveal();assert(view==='voteSummary','No debe revelar roles con un empate pendiente.');
        beginVoting(true);openBallot();assert(activeLayer.querySelector('[data-id="0"]').disabled,'El ganador previo no debe competir en el desempate.');
        cast([1,2,1,2,1,2]);assert(game.tiedIds.length===2,'El empate repetido debe volver a resolverse.');
        beginVoting(true);cast([1,1,1,1,1,2]);
        assert(game.votes.join(',')==='0,1','El desempate perdió al ganador anterior.');
        beginReveal();advance(5500);continueVerdict();
        assert(game.revealIndex===1&&game.revealStage==='processing','Falta la segunda revelación con suspenso.');
        advance(5500);continueVerdict();assert(view==='guess','Dos impostores descubiertos deben tener última oportunidad.');
        const before=sessionScore.impostors;finish('guessed');assert(sessionScore.impostors===before+1,'Adivinar no concede la victoria.');
      });
      const changeVote=(voterId,suspectId,save=true)=>{
        editVote(voterId);openBallot();
        activeLayer.querySelector(`[data-action="suspect"][data-id="${suspectId}"]`).click();
        actions.querySelector(`[data-action="${save?'save-vote':'cancel-vote-edit'}"]`).click();
      };
      test('Corregir un voto, cancelar y conservar los demás',()=>{
        prepare();cast([0,0,0,0,1,2]);
        const originalBallots=JSON.stringify(game.ballots);
        showVoteEditor();assert(sheetOpen&&sheetContent.querySelectorAll('[data-action="edit-vote"]').length===6,'Falta el selector de votantes.');
        sheetContent.querySelector('[data-action="edit-vote"][data-id="0"]').click();
        assert(!sheetOpen&&game.editingVote&&game.selectedVote===0,'No recuperó el voto original.');
        openBallot();assert(activeLayer.querySelector('[data-id="0"]').getAttribute('aria-pressed')==='true','Falta la selección actual.');
        activeLayer.querySelector('[data-id="2"]').click();endVoteEdit();
        assert(view==='voteSummary'&&JSON.stringify(game.ballots)===originalBallots,'Cancelar modificó los votos.');
        changeVote(0,2);changeVote(1,2);
        assert(game.votes.join(',')==='2'&&game.ballots.length===6,'La corrección no cambió el ganador o agregó votos.');
        assert(JSON.stringify(game.ballots.slice(2))===JSON.stringify(JSON.parse(originalBallots).slice(2)),'Cambió votos de otras personas.');
        assert(!game.editingVote&&game.selectedVote===null,'Quedó una selección privada pendiente.');
        const corrected=JSON.stringify(game.ballots);beginReveal();editVote(0);endVoteEdit(true);
        assert(view==='suspense'&&JSON.stringify(game.ballots)===corrected,'Se pudo editar después de iniciar el veredicto.');
        cancelReveal();
      });
      test('Corregir recalcula empates y posiciones sin acumular ganadores',()=>{
        prepare(2);cast([0,0,0,0,1,2]);countVotes();countVotes();
        assert(game.lockedIds.join(',')==='0'&&game.tiedIds.join(',')==='1,2','Recontar acumuló posiciones.');
        changeVote(0,1);
        assert(!game.lockedIds.length&&!game.tiedIds.length&&game.votes.join(',')==='0,1','La corrección no eliminó el empate anterior.');
        changeVote(1,2);
        assert(!game.lockedIds.length&&game.tiedIds.join(',')==='0,1,2'&&!game.votes.length,'Una posición quedó fijada por el recuento anterior.');
      });
      test('Corregir el desempate conserva posiciones de rondas previas',()=>{
        prepare(2);cast([0,0,0,0,1,2]);beginVoting(true);cast([1,1,1,1,2,2]);
        changeVote(0,2);
        assert(game.lockedIds.join(',')==='0'&&game.tiedIds.join(',')==='1,2','La corrección del desempate perdió el primer puesto.');
        editVote(1);openBallot();assert(activeLayer.querySelector('[data-id="0"]').disabled,'Permite votar fuera de los empatados.');
        game.selectedVote=0;endVoteEdit(true);
        assert(game.editingVote&&game.ballots[1].suspectId===1,'Guardó un destinatario ajeno al desempate.');
        game.selectedVote=2;endVoteEdit(true);
        assert(game.votes.join(',')==='0,2'&&!game.tiedIds.length,'El recuento del desempate corregido es incorrecto.');
      });
    }finally{
      cancelReveal();stopHold();intervals.clear();timeouts.clear();Date.now=original.now;performance.now=original.performanceNow;
      window.setInterval=original.setInterval;window.clearInterval=original.clearInterval;window.setTimeout=original.setTimeout;window.clearTimeout=original.clearTimeout;
      randomIndex=original.randomIndex;requestWakeLock=original.requestWakeLock;
    }
    return results;
  }
  </script>
