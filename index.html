  <noscript>Activa JavaScript para jugar a IMPOSTOR.</noscript>
  <script>
  'use strict';
  const DEFAULT_CATEGORIES = [

    {id:'travel',name:'Viajes y Destinos',icon:'compass',words:['París','Río de Janeiro','Nueva York','Machu Picchu','Cancún','Roma','Tokio','Buenos Aires','Madrid','Barcelona','Cartagena','Londres','Punta Cana']},
    {id:'sports',name:'Deportes y Pasiones',icon:'trophy',words:['Fútbol','Mundial','Lionel Messi','Diego Maradona','Baloncesto','Tenis','Estadio Lleno','Árbitro','Golazo','Fórmula 1','Trofeo','Gimnasio','Boxeo']},
    {id:'mystery',name:'Mitos y Leyendas',icon:'flame',words:['La Llorona','El Chupacabras','Triángulo de las Bermudas','Ovni','Monstruo del Lago Ness','Pie Grande','Maldición','Tablero Ouija','Hechizo','Poción Mágica','Pacto Secreto','Espejo Maldito']}

  // Keep the existing key so saved groups and custom categories migrate in place.

  const $ = selector => document.querySelector(selector);
  const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const cleanText = value => String(value).replace(/\p{Extended_Pictographic}|\p{Regional_Indicator}|[\u200d\ufe0f\u20e3\u{1f3fb}-\u{1f3ff}]/gu,'').trim().replace(/\s+/g,' ');
  const normalize = value => cleanText(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').replace(/[^a-z0-9ñ]+/g,' ').trim().replace(/\s+/g,' ');
  const formatTime = ms => {const s=Math.ceil(ms/1000);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;};
  const duration = () => Math.max(60,settings.players.length*30)*1000;
  // Small inline vector set also keeps every control recognizable without a CDN.
  const paths = {

    'shield-check':'<path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6Zm-5 10 3 3 6-6"/>',

    'skull':'<path d="M6 17a9 9 0 1 1 12 0v5H6Z"/><circle cx="8" cy="11" r="1.5"/><circle cx="16" cy="11" r="1.5"/><path d="m11 16 1-2 1 2m-3 3v3m4-3v3"/>',
    'gift':'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13m0-13C3 8 5 1 8 3Zm0 0c9 0 7-7 4-5Z"/>',
    'music':'<path d="M9 18V5l12-3v13M9 9l12-3"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="18" cy="15" rx="3" ry="3"/>',
    'clapperboard':'<path d="M3 10h18v11H3Zm0 0L2 5l18-4 1 5Zm3-6 4 4m3-6 4 4"/>',
    'utensils':'<path d="M4 3v5a3 3 0 0 0 6 0V3M7 3v19m13 0V3c-5 3-5 11 0 11"/>',
    'compass':'<circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5Z"/>',
    'trophy':'<path d="M7 3h10v7a5 5 0 0 1-10 0Zm0 2H3v4a4 4 0 0 0 4 4m10-8h4v4a4 4 0 0 1-4 4m-5 2v6m-5 0h10"/>',
    'flame':'<path d="M13 2c1 6 8 8 7 14a8 8 0 0 1-16 0c0-3 2-7 5-9 0 4 3 4 4 1Z"/>',
    'layers':'<path d="m12 3 10 6-10 6L2 9Zm-10 11 10 6 10-6M2 18l10 6 10-6"/>',
    'trash-2':'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>',
    'pause':'<path d="M8 5v14M16 5v14"/>','play':'<path d="m7 4 14 8-14 8Z"/>',
    'clock':'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>','eye':'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'
  };
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${paths[name]||paths.eye}</svg></i>`;
  const crest = (kind='eye') => `<svg viewBox="0 0 100 110" fill="none" aria-hidden="true"><path d="M50 5 86 23v38c0 22-36 42-36 42S14 83 14 61V23Z" stroke="currentColor" stroke-opacity=".3"/><path d="m50 12 29 15v33c0 17-29 35-29 35S21 77 21 60V27Z" stroke="currentColor" stroke-opacity=".12"/>${kind==='dagger'?'<path d="m50 19 10 21-6 28-4 20-4-20-6-28Z" fill="currentColor"/><path d="m31 46 19 6 19-6-3 9-13 4-3 12-3-12-13-4Z" fill="#190b10" stroke="currentColor"/><path d="M50 25v20" stroke="#ffadb7"/>':kind==='victory'?'<path d="M36 34h28v17a14 14 0 0 1-28 0ZM36 38H26v10c0 7 5 11 12 11m26-21h10v10c0 7-5 11-12 11M50 65v13m-13 2h26" stroke="currentColor" stroke-width="2"/>':'<path d="M27 52s9-13 23-13 23 13 23 13-9 13-23 13-23-13-23-13Z" stroke="currentColor" stroke-width="1.6"/><circle cx="50" cy="52" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M50 25v7m0 40v8M22 52h-6m68 0h-6" stroke="currentColor"/>'}</svg>`;
  let storageFailed=false;
  function loadSettings(){
    const fallback={players:[],impostors:1,hints:false,muted:false,active:['halloween','birthday'],custom:[]};
    try{
      const raw=JSON.parse(localStorage.getItem(STORAGE_KEY));if(!raw||typeof raw!=='object')return fallback;
      const players=Array.isArray(raw.players)?raw.players.filter(p=>typeof p==='string').map(p=>cleanText(p).slice(0,24)).filter(p=>normalize(p)).filter((p,i,a)=>a.findIndex(x=>normalize(x)===normalize(p))===i).slice(0,20):[];
      const custom=Array.isArray(raw.custom)?raw.custom.filter(c=>c&&/^custom-[a-z0-9-]+$/.test(c.id)&&typeof c.name==='string'&&Array.isArray(c.words)).slice(0,20).map(c=>({id:c.id,name:cleanText(c.name).slice(0,36),icon:'layers',words:c.words.filter(w=>typeof w==='string').map(w=>cleanText(w).slice(0,48)).filter(w=>normalize(w)).filter((w,i,a)=>a.findIndex(x=>normalize(x)===normalize(w))===i).slice(0,100)})).filter(c=>normalize(c.name)&&c.words.length>=3).filter((c,i,a)=>a.findIndex(x=>x.id===c.id)===i):[];
      const ids=[...DEFAULT_CATEGORIES,...custom].map(c=>c.id);
      const active=Array.isArray(raw.active)?[...new Set(raw.active.filter(id=>ids.includes(id)))]:fallback.active;
      return {players,impostors:raw.impostors===2?2:1,hints:raw.hints===true,muted:raw.muted===true,custom,active};
    }catch{storageFailed=true;return fallback;}
  }
  let settings=loadSettings(),game=null,view='setup',step=0;
  let toastTimeout,timerInterval,holdTimeout,holding=false,pointerId=null,holdKey=null;
  let wakeLock=null,wakeRequest=null,audioCtx=null,audioMaster=null;
  const app=$('#app'),actions=$('#actions'),modal=$('#modal');
  const allCategories=()=>[...DEFAULT_CATEGORIES,...settings.custom];
  function saveSettings(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(settings));}catch{if(!storageFailed)toast('No se pudo guardar. Puedes seguir jugando durante esta sesión.');storageFailed=true;}}
  function icons(){if(window.lucide)window.lucide.createIcons();else document.querySelectorAll('i[data-lucide]:empty').forEach(el=>el.outerHTML=icon(el.dataset.lucide));}
  function toast(message){clearTimeout(toastTimeout);$('#toast').textContent=message;$('#toast').hidden=false;toastTimeout=setTimeout(()=>$('#toast').hidden=true,3600);}
  function randomIndex(length){if(window.crypto?.getRandomValues){const b=new Uint32Array(1),limit=Math.floor(4294967296/length)*length;do{crypto.getRandomValues(b);}while(b[0]>=limit);return b[0]%length;}return Math.floor(Math.random()*length);}
  function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=randomIndex(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
  async function requestWakeLock(){if(!('wakeLock' in navigator)||wakeLock||wakeRequest||document.hidden||!game||view==='result')return;try{wakeRequest=navigator.wakeLock.request('screen');const lock=await wakeRequest;if(!game||view==='result'||document.hidden){await lock.release();return;}wakeLock=lock;lock.addEventListener('release',()=>{if(wakeLock===lock)wakeLock=null;});}catch{}finally{wakeRequest=null;}}
  function releaseWakeLock(){if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;}}
  // Unlock audio only from a gesture; reveal and countdown can then play later on iOS.
  function unlockAudio(){if(settings.muted)return;try{if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioMaster=audioCtx.createGain();audioMaster.gain.value=.65;audioMaster.connect(audioCtx.destination);}if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});}catch{}}
  function sound(type){if(settings.muted||document.hidden)return;unlockAudio();if(!audioCtx||audioCtx.state!=='running')return;
    const now=audioCtx.currentTime;
    const tone=(freq,delay,length,volume=.1,wave='sine',end=freq)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=wave;o.frequency.setValueAtTime(freq,now+delay);o.frequency.exponentialRampToValueAtTime(end,now+delay+length);g.gain.setValueAtTime(.0001,now+delay);g.gain.exponentialRampToValueAtTime(volume,now+delay+Math.min(.02,length/4));g.gain.exponentialRampToValueAtTime(.0001,now+delay+length);o.connect(g);g.connect(audioMaster);o.start(now+delay);o.stop(now+delay+length+.02);o.onended=()=>{o.disconnect();g.disconnect();};};
    if(type==='click')tone(420,0,.015,.12,'sine',180);
    if(type==='crew-reveal')[110,164.81,220].forEach((f,i)=>tone(f,i*.02,.8,.055));
    if(type==='impostor-reveal')[55,82.41,116.54].forEach((f,i)=>tone(f,i*.03,1.15,.065,'triangle'));
    if(type==='tick'){tone(65,0,.11,.13,'sine',42);tone(55,.16,.09,.07,'sine',38);}
    if(type==='gong')[65.41,131.8,194.5,277.2].forEach((f,i)=>tone(f,0,2.2-i*.25,.12/(i+1),'sine',f*.96));
    if(type==='vote')tone(140,0,.12,.22,'sine',45);
    if(type==='crew-win')[130.81,164.81,196,261.63].forEach((f,i)=>tone(f,i*.11,1,.06,'triangle',f*1.008));
    if(type==='impostor-win')[110,116.54,164.81,55].forEach((f,i)=>tone(f,i*.12,1.5,.065,'triangle',f*.85));
  }
  function updateSound(){const b=$('#sound-button');b.innerHTML=icon(settings.muted?'volume-x':'volume-2');b.setAttribute('aria-label',settings.muted?'Activar sonido':'Silenciar sonido');b.setAttribute('aria-pressed',String(settings.muted));}
  function setView(next){stopHold();view=next;render();app.focus({preventScroll:true});}
  function heading(kicker,title,description='',center=false){return `<div class="screen-heading ${center?'center-heading':''}"><div class="eyebrow">${kicker}</div><h1>${title}</h1>${description?`<p class="intro">${description}</p>`:''}</div>`;}
  function screen(content){return `<section class="screen" data-screen="${view==='setup'?`setup-${step}`:view}">${content}</section>`;}
  function primary(label,action,disabled=false,id=''){return `<button ${id?`id="${id}"`:''} class="primary" data-action="${action}" ${disabled?'disabled':''}>${label}${icon('arrow-right')}</button>`;}
  function render(){
    app.innerHTML=({setup:setupView,pass:passView,game:gameView,vote:voteView,guess:guessView,result:resultView}[view])();
    renderActions();updateSound();const n=view==='setup'?step:({pass:0,game:1,vote:2,guess:2,result:3}[view]);

  }
  function stepError(){if(step===0&&settings.players.length<3)return 'Mínimo 3 jugadores';if(step===1&&settings.players.length<(settings.impostors===2?5:3))return 'Necesitas 5 jugadores para elegir 2 impostores';if(step===2&&!settings.active.length)return 'Elige al menos una categoría';return '';}

    if(view==='pass')html=`${primary(game.passIndex===game.players.length-1?'Comenzar debate':'Pasar el teléfono','next-player',!game.seen||holding,'next-player')}<div class="action-caption"><span>Solo tus ojos</span><span>${String(game.passIndex+1).padStart(2,'0')} / ${String(game.players.length).padStart(2,'0')}</span></div>`;
    if(view==='game')html=`${primary('Votar','vote')}<div class="action-caption"><span>Confía en tus sospechas</span><span>${game.players.length} jugadores</span></div>`;
    if(view==='vote')html=`<div class="button-stack">${primary('Confirmar sospechas','confirm-vote',game.votes.length!==game.impostorIds.length)}<button class="text-button" data-action="back-debate">Volver al debate</button></div>`;
    if(view==='guess')html=`<div class="button-stack"><button class="primary" type="submit" form="guess-form">Confirmar palabra ${icon('arrow-right')}</button><button class="text-button" data-action="skip-guess">Rendirse y revelar la palabra</button></div>`;
    if(view==='result')html=`<div class="button-stack">${primary('Otra ronda','start')}<button class="text-button" data-action="setup">Editar jugadores y categorías</button></div>`;
    actions.innerHTML=html;
  }

  function configureAppIcons(){const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><rect width="180" height="180" rx="38" fill="#080405"/><path d="m90 25 22 42-13 54-9 35-9-35-13-54Z" fill="#ff2a3b"/><path d="m48 76 42 13 42-13-7 19-28 9-7 25-7-25-28-9Z" fill="#080405" stroke="#ff2a3b" stroke-width="3"/><path d="m90 36-5 33 5 10Z" fill="#ffa0aa"/></svg>`,url=`data:image/svg+xml,${encodeURIComponent(svg)}`;$('#favicon').href=url;$('#touch-icon').href=url;const image=new Image();image.onload=()=>{try{const canvas=document.createElement('canvas');canvas.width=canvas.height=180;canvas.getContext('2d').drawImage(image,0,0,180,180);$('#touch-icon').href=canvas.toDataURL('image/png');}catch{}};image.src=url;const manifest={name:'IMPOSTOR: HALLOWEDDA EDITION',short_name:'Impostor',start_url:location.href.split('#')[0].split('?')[0],display:'standalone',background_color:'#080405',theme_color:'#080405',icons:[{src:url,sizes:'any',type:'image/svg+xml',purpose:'any'}]};$('#manifest').href=`data:application/manifest+json,${encodeURIComponent(JSON.stringify(manifest))}`;}
