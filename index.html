  function guessView(){const plural=game.impostorIds.length>1;return `<section class="game-view motion-in"><div class="view-heading"><div class="eyebrow">Última oportunidad</div><h1>¡Los descubrieron!</h1><p>${plural?'Los impostores tienen':'El impostor tiene'} un único intento para adivinar la palabra.</p></div><section class="panel"><div class="result-symbol" aria-hidden="true">👻</div><p class="result-names" style="text-align:center">${game.players.filter(p=>game.impostorIds.includes(p.id)).map(p=>escapeHTML(p.name)).join(' y ')}</p><form id="guess-form"><label class="subtle" for="word-guess">${plural?'Su respuesta en equipo':'Tu respuesta'}</label><input class="field spaced" id="word-guess" maxlength="48" placeholder="¿Cuál era la palabra?" autocomplete="off" autocapitalize="none" spellcheck="false" required><button class="primary spaced" type="submit">Esta es mi apuesta ${icon('sparkles')}</button></form><button class="secondary spaced" data-action="skip-guess">Rendirse y revelar la palabra</button></section></section>`;}
  function resultView(){const crew=game.outcome==='crew';const plural=game.impostorIds.length>1;return `<section class="game-view motion-in"><div class="result-symbol" aria-hidden="true">${crew?'🎉':'👻'}</div><div class="view-heading"><div class="eyebrow">Misterio resuelto</div><h1>${crew?'¡Ganaron los tripulantes!':`¡Gan${plural?'aron los impostores':'ó el impostor'}!`}</h1><p>${crew?'Ningún secreto se le escapa a esta mesa.':game.outcome==='guessed'?'Una última palabra cambió toda la partida.':'Un poco de cara de inocente hizo el trabajo.'}</p></div><section class="panel result-card glass"><p class="subtle">${plural?'Los impostores eran':'El impostor era'}</p><p class="result-names">${game.players.filter(p=>game.impostorIds.includes(p.id)).map(p=>escapeHTML(p.name)).join(' y ')}</p><div class="divider"></div><p class="subtle">La palabra secreta</p><p class="result-word">${escapeHTML(game.word)}</p><p class="result-category">${game.category.emoji} ${escapeHTML(game.category.name)}</p></section><p class="result-detail">La mesa votó por: ${game.players.filter(p=>game.votes.includes(p.id)).map(p=>escapeHTML(p.name)).join(' y ')}.</p><button class="primary spaced" data-action="start">Otra ronda, nuevas sospechas ${icon('arrow-right')}</button><button class="secondary spaced" data-action="setup">Editar jugadores y categorías</button></section>`;}
  function finish(outcome){clearInterval(timerInterval);game.deadline=null;game.outcome=outcome;setView('result');if(window.confetti)window.confetti({particleCount:110,spread:80,origin:{y:.65},colors:['#FF6B00','#9D00FF','#e0c9fb','#ffffff'],disableForReducedMotion:true});}
  function openModal(html){stopHold();modal.innerHTML=html;modal.showModal();icons();}
  const modalHeader = title => `<div class="dialog-heading"><h2 id="modal-title">${title}</h2><button class="icon-button" data-action="close-modal" aria-label="Cerrar">${icon('x')}</button></div>`;
  function showHelp(){openModal(`${modalHeader('Así se juega')}<ol><li><strong>Junten al grupo.</strong> Necesitan al menos 3 jugadores, o 5 si quieren 2 impostores.</li><li><strong>Pasen el teléfono.</strong> Cada persona mantiene el botón presionado para mirar su carta. Los tripulantes ven la misma palabra; el impostor no la conoce.</li><li><strong>Den una pista por turno.</strong> Una palabra relacionada, sin revelar el secreto. El impostor intenta disimular.</li><li><strong>Debatan y voten.</strong> Tienen 60 segundos. Con 2 impostores, deben descubrir a ambos.</li><li><strong>Una última oportunidad.</strong> Si los descubren, los impostores tienen un solo intento, en equipo, para adivinar la palabra y ganar.</li></ol><div class="divider"></div><p><strong>En tu iPhone:</strong> abre la página en Safari, toca Compartir y luego “Agregar a inicio”.</p><p class="small-print">Esta versión de un solo archivo necesita conexión para abrirse por primera vez. Una vez cargada, la partida sigue sin conexión. Reabrirla sin internet no está garantizado.</p><button class="primary spaced" data-action="close-modal">Entendido. A sospechar.</button>`);}
  function showCustom(){if(settings.custom.length>=20)return toast('Puedes crear hasta 20 categorías.');openModal(`${modalHeader('Tu propio misterio')}<p>Chistes internos, amigos de la fiesta o ese tema que solo ustedes entienden.</p><form id="category-form"><label for="category-name">Nombre de la categoría</label><input id="category-name" class="field" maxlength="36" required placeholder="Ej. Leyendas de la fiesta" autocomplete="off"><label for="category-words">Palabras separadas por comas o saltos de línea</label><textarea id="category-words" class="field" maxlength="5000" required placeholder="La terraza, El vecino, El karaoke…"></textarea><p class="small-print">De 3 a 100 palabras distintas. Hasta 48 caracteres por palabra.</p><p id="category-error" class="error-text" role="alert"></p><button class="primary spaced" type="submit">Guardar categoría ${icon('plus')}</button></form>`);}
  function confirmReset(){openModal(`${modalHeader('¿Volvemos a empezar?')}<p>La partida actual termina. Tu lista de jugadores y categorías queda guardada.</p><div class="button-row"><button class="secondary" data-action="close-modal">Seguir jugando</button><button class="danger" data-action="reset-confirm">Terminar partida</button></div>`);}
  document.addEventListener('submit',event=>{
    if(event.target.id==='player-form'){event.preventDefault();const input=$('#player-name');const name=input.value.trim().replace(/\s+/g,' ');if(!normalize(name))return toast('Escribe un nombre con letras o números.');if(settings.players.length>=20)return toast('La mesa está llena: máximo 20 jugadores.');if(settings.players.some(p=>normalize(p)===normalize(name)))return toast('Ese nombre ya está en la mesa. Agrega un apodo.');settings.players.push(name);saveSettings();input.value='';refreshPlayers();input.focus();}
    if(event.target.id==='category-form'){event.preventDefault();const name=$('#category-name').value.trim();const rawWords=$('#category-words').value.split(/[,;\n]+/).map(w=>w.trim()).filter(Boolean);const words=rawWords.filter((w,i,a)=>a.findIndex(x=>normalize(x)===normalize(w))===i);let error='';if(!normalize(name))error='Escribe un nombre para la categoría.';else if(allCategories().some(c=>normalize(c.name)===normalize(name)))error='Ya existe una categoría con ese nombre.';else if(words.length<3||words.length>100)error='Agrega entre 3 y 100 palabras distintas.';else if(words.some(w=>w.length>48||!normalize(w)))error='Cada palabra debe tener letras o números y hasta 48 caracteres.';if(error){$('#category-error').textContent=error;return;}const id=`custom-${Date.now().toString(36)}-${randomIndex(1000000).toString(36)}`;settings.custom.push({id,name,emoji:'✨',words});settings.active.push(id);saveSettings();modal.close();render();toast('Tu categoría ya está en la mezcla.');}
    if(event.target.id==='guess-form'){event.preventDefault();const guess=$('#word-guess').value;if(!normalize(guess))return toast('Escribe tu apuesta antes de revelar.');finish(normalize(guess)===normalize(game.word)?'guessed':'crew');}
  });
  document.addEventListener('click',event=>{
    const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;
    if(action==='close-modal')return modal.close();
    if(action==='remove-player'){settings.players.splice(Number(button.dataset.index),1);saveSettings();refreshPlayers();$('#player-name').focus();}
    if(action==='impostors'){settings.impostors=Number(button.dataset.count);saveSettings();document.querySelectorAll('[data-action="impostors"]').forEach(b=>b.setAttribute('aria-pressed',b===button));refreshPlayers();}
    if(action==='hints'){settings.hints=!settings.hints;button.setAttribute('aria-checked',settings.hints);saveSettings();}
    if(action==='category'){const id=button.dataset.id;settings.active=settings.active.includes(id)?settings.active.filter(x=>x!==id):[...settings.active,id];button.setAttribute('aria-pressed',settings.active.includes(id));$('#category-count').textContent=`${settings.active.length} ${settings.active.length===1?'activa':'activas'}`;saveSettings();refreshPlayers();}
    if(action==='custom')showCustom();
    if(action==='delete-category'){const c=settings.custom.find(x=>x.id===button.dataset.id);if(c)openModal(`${modalHeader('¿Eliminar categoría?')}<p>Se eliminarán “${escapeHTML(c.name)}” y sus palabras de este dispositivo.</p><div class="button-row"><button class="secondary" data-action="close-modal">Cancelar</button><button class="danger" data-action="delete-category-confirm" data-id="${c.id}">Eliminar</button></div>`);}
    if(action==='delete-category-confirm'){settings.custom=settings.custom.filter(c=>c.id!==button.dataset.id);settings.active=settings.active.filter(id=>id!==button.dataset.id);saveSettings();modal.close();render();}
    if(action==='start')startGame();
    if(action==='next-player')nextPlayer();
    if(action==='move'&&!game.cluesStarted){const index=Number(button.dataset.index),destination=index+Number(button.dataset.direction);if(destination>=0&&destination<game.order.length){[game.order[index],game.order[destination]]=[game.order[destination],game.order[index]];render();const target=app.querySelector(`[data-action="move"][data-index="${destination}"][data-direction="${button.dataset.direction}"]`);if(target&&!target.disabled)target.focus();else app.focus();}}
    if(action==='next-clue'){game.cluesStarted=true;game.clueIndex++;if(game.clueIndex>=game.order.length){game.phase='discussion';render();startTimer();}else render();}
    if(action==='timer-toggle'){if(game.deadline)pauseTimer();else startTimer();}
    if(action==='timer-reset'){pauseTimer();game.remaining=60000;$('#timer-announcement').textContent='¿Quién está improvisando demasiado?';startTimer();}
    if(action==='vote'){pauseTimer();setView('vote');}
    if(action==='suspect'){const id=Number(button.dataset.id);if(game.votes.includes(id))game.votes=game.votes.filter(x=>x!==id);else if(game.votes.length<game.impostorIds.length)game.votes.push(id);else if(game.impostorIds.length===1)game.votes=[id];else return toast('Quita una selección antes de elegir a otra persona.');render();app.querySelector(`[data-action="suspect"][data-id="${id}"]`)?.focus();}
    if(action==='back-debate')setView('game');
    if(action==='confirm-vote'&&game.votes.length===game.impostorIds.length){if(game.impostorIds.every(id=>game.votes.includes(id)))setView('guess');else finish('impostors');}
    if(action==='skip-guess')finish('crew');
    if(action==='setup'||action==='reset-confirm'){clearInterval(timerInterval);modal.close();stopHold();game=null;setView('setup');}
  });
  $('#help-button').addEventListener('click',showHelp);$('#reset-button').addEventListener('click',confirmReset);
  window.addEventListener('blur',stopHold);window.addEventListener('pagehide',stopHold);document.addEventListener('visibilitychange',()=>{stopHold();if(!document.hidden)updateTimer();});window.addEventListener('pointerup',stopHold);window.addEventListener('pointercancel',stopHold);
  window.addEventListener('load',icons);
  render();
  if(storageFailed)toast('Almacenamiento no disponible. Puedes jugar durante esta sesión.');
  </script>
</body>
</html>
