        assert(game.remaining===0&&!game.deadline&&intervals.size===0,'El temporizador no se detuvo en cero.');
        assert($('#timer-display').textContent==='00:00'&&$('#timer-toggle').disabled,'Estado final incorrecto.');
        assert($('#timer-announcement').textContent.includes('Es hora de votar'),'Falta el aviso de votación.');
        advance(5000);assert(game.remaining===0,'El tiempo se volvió negativo.');
        extendTimer();assert(game.remaining===30000&&intervals.size===1,'No se puede extender un debate terminado.');
        pauseTimer();
      });
    }finally{
      intervals.clear();Date.now=original.now;window.setInterval=original.setInterval;window.clearInterval=original.clearInterval;
      randomIndex=original.randomIndex;requestWakeLock=original.requestWakeLock;
    }
    return results;
  }
  </script>
